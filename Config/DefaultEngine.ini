[/Script/Engine.PhysicsSettings]
; --- Protect the physics timestep (project principle 26) ---
; Physics is split into substeps no longer than 1/480 s, independent of render frame rate.
; 16 substeps x 1/480 s = 1/30 s: a frame slower than 30 FPS slows simulated time down instead
; of taking one large, unstable physics step.
; Why 480 Hz (Milestone 4): muscles are explicit torques, capped per substep at what the two
; segments' free-body inertia can take (see FAthleteMuscleSimCallback). The light foot capped
; the ankle's damping to almost nothing at 240 Hz: standing sway after a 10 N*s push never
; settled (11-12 mm RMS, 0.3 J still moving). At 480 Hz: 3.4 mm, at rest. Costs ~2x physics time.
bSubstepping=True
MaxSubstepDeltaTime=0.002083333
MaxSubsteps=16
MaxPhysicsDeltaTime=0.033333333

