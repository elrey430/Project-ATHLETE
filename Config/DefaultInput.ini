[/Script/Engine.InputSettings]
; Enhanced Input is Unreal's current input system (built into UE5, enabled by default).
; ATHLETE's player controls will be defined with it when locomotion arrives (Milestone 4).
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde
