# Project ATHLETE - Milestone 4: a TRACKING policy for controller-driven movement (DReCon-style).
# Controller input -> motion matching (Scripts/MuJoCo/motion_matching.py) picks the mocap that does it ->
# this policy makes the simulated athlete follow that reference with its own torques. AMP (commands straight
# into the policy) failed twice on 2026-10-01; tracking is the method already proven on this body (the
# walking policy: 0/20 falls on the full CPU model).
# Same PPO settings as athlete_walk.yaml (LocoMuJoCo's jax_rl_mimic example, DeepMimic reward), and:
#  - motion: the six mocap clips fitted to the athlete (walk, run, turning on the spot, random walking with
#    starts/stops/turns, stepping in place x2) PLUS twelve 5-minute clips the motion matcher made from random
#    controller input (mm_random_0..11, made on the VM by run.sh): matcher output, jumps and blends
#    included, is what the policy follows at run time. Hard clips are listed several times (see task);
#  - training starts from a previous policy's weights (run.sh --init-from, the uploaded PPOJax_saved.pkl):
#    the walking policy for run 1, run 1's tracker for run 2, run 2's for run 3, run 3's for run 4;
#  - run 3 (fidelity): goal GoalTrajMimicLookahead (the reference 0.1/0.2/0.3 s ahead, appended to the
#    observation: the warm start widens the inputs), and the athlete's shared contact model (heel + ball
#    soles, limbs with the floor, capsule self-collision: athlete_loco.env.configure_contacts), the same
#    model the tests run;
#  - run 4 (turning): the fidelity tracker couldn't follow turns. Mirrored mocap (mirror_motion.py: turns
#    both ways), 12 turn-heavy matcher clips (mm_turn_*: 80% of commands turn, a quarter on the spot),
#    turning material at ~82% of episode starts, and reward MimicHeadingReward (MimicReward plus explicit
#    facing and turning-rate terms, athlete_loco/rewards.py);
#  - run 5 (invariant): the observation no longer depends on the athlete's compass heading (invariant_obs,
#    goal GoalTrackInvariant: athlete_loco/invariant.py, proven by Scripts/MuJoCo/check_invariance.py).
#    Run 4's tracker turned the wrong way on the spot when it started facing 90 degrees. New observation
#    layout, so training starts FROM SCRATCH (no PPOJax_saved.pkl uploaded);
#  - run 6 (speed): run 5's tracker brakes and turns (3/6 M4 tests, 5/5 trials) but lags the reference
#    speed (~0.2 m/s walking, ~1 m/s running). Warm start from it; a speed term in the reward
#    (velocity_w_sum); running clips x3; 6 speed-heavy matcher clips (mm_speed_*) next to 6 turn-heavy
#    ones; the quiet-standing clip (stand, stand_motion.py);
#  - run 7 (running manoeuvres): run 6's best tracker (chunk 14) passes 5/6 M4 tests; every random-command
#    fall was at running speed while turning or sidestepping, or after a big speed jump. Warm start from it;
#    6 running-manoeuvre matcher clips (mm_runman_*, motion_matching.py --run-maneuvers) next to 4
#    turn-heavy and 4 speed-heavy ones;
#  - run 8 (recovery): random pushes on the pelvis plus sensor noise during training (PushRandomizer,
#    athlete_loco/robustness.py), so the tracker learns to get back on the reference. Same clips as run 7.
#  - run 9 (100STYLE data): the falls left came at walk-to-run transitions - the mocap had nothing between
#    1.5 and 2.5 m/s. 21 100STYLE clips (CC BY 4.0; jogging, walk-jog-run transitions, sidestep runs, 7 plain
#    styles) fill it; the matcher clips are generated from the database with them (ATHLETE_MOTION_SET=100style).
#  - run 10: run 9 continued (warm start from its final checkpoint), same data, 4 h of training: run 9 was
#    still improving when its 2 h ran out (episode length 420 -> 721).
defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "athlete-tracking"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      default_dataset_conf:
        # Episodes start in a random FILE (uniform), so a clip listed twice gets twice the starts. Run 1
        # (one of each, 6 matcher clips) learned walking and standing but fell within ~1.5 s on the turning,
        # start/stop and matcher clips: they got a few % of training each (short episodes). Hard material
        # now gets ~87% of the starts.
        # Run 9: walk_mirror out (memory; mirrored walking still comes through the matcher clips) and the
        # 100STYLE clips in, once each (their mirrors are in the matcher database).
        task: [walk, stepinplace1, stepinplace2, stand, stand,
               run, run, run, run_mirror, run_mirror, run_mirror,
               walkturn, walkturn, walkturn_mirror, walkturn_mirror,
               random_walk, random_walk, random_walk_mirror, random_walk_mirror,
               mm_turn_0, mm_turn_1, mm_turn_2, mm_turn_3, mm_speed_0, mm_speed_1, mm_speed_2, mm_speed_3,
               mm_runman_0, mm_runman_1, mm_runman_2, mm_runman_3, mm_runman_4, mm_runman_5,
               100style_neutral_fr, 100style_neutral_sr, 100style_neutral_tr1,
               100style_rushed_fr, 100style_rushed_sr, 100style_rushed_tr1,
               100style_angry_fr, 100style_angry_sr, 100style_angry_tr1,
               100style_bigsteps_fr, 100style_bigsteps_sr, 100style_bigsteps_tr1,
               100style_followed_fr, 100style_followed_sr, 100style_followed_tr1,
               100style_crowdavoidance_fr, 100style_crowdavoidance_sr, 100style_crowdavoidance_tr1,
               100style_proud_fr, 100style_proud_sr, 100style_proud_tr1]
  env_params:
    env_name: MjxAthleteReference
    use_mjwarp: True
    # Contact buffer: raised from 7000 for run 3's extra pairs (limbs with the floor, self-collision).
    nconmax: 12000
    # Constraint rows per world for MuJoCo Warp (joint limits + contacts). The default was too small for
    # the athlete (37 hinges with anatomical limits): 3,483 "nefc overflow ... increase njmax to <=101"
    # messages on 2026-09-30, i.e. limits and contacts silently dropped. The H1 never needed this.
    njmax: 200  # 160 until run 3; raised for its extra contact pairs
    headless: True
    horizon: 1000
    goal_type: GoalTrackInvariant
    invariant_obs: true
    # Recovery training (run 8): pushes + sensor noise. LocoMuJoCo's randomizer reads every key below; the
    # model randomizations (mass, friction, gravity, ...) stay off: per-world model changes are untested on
    # MuJoCo Warp, and our contacts are explicit pairs its friction randomization wouldn't reach.
    domain_randomization_type: PushRandomizer
    domain_randomization_params:
      push_interval_s: [2.0, 5.0]
      push_duration_s: [0.1, 0.2]
      push_impulse_ns: [0.0, 20.0]
      add_joint_pos_noise: true
      joint_pos_noise_scale: 0.01   # rad
      add_joint_vel_noise: true
      joint_vel_noise_scale: 0.1    # rad/s
      add_gravity_noise: true
      gravity_noise_scale: 0.02     # of the unit gravity direction (tilt sensing)
      add_free_joint_lin_vel_noise: false
      lin_vel_noise_scale: 0.0
      add_free_joint_ang_vel_noise: false
      ang_vel_noise_scale: 0.0
      add_p_gains_noise: false
      p_gains_noise_scale: 0.0
      add_d_gains_noise: false
      d_gains_noise_scale: 0.0
      randomize_gravity: false
      gravity_range: [9.81, 9.81]
      randomize_geom_friction_tangential: false
      geom_friction_tangential_range: [0.7, 0.7]
      randomize_geom_friction_torsional: false
      geom_friction_torsional_range: [0.005, 0.005]
      randomize_geom_friction_rolling: false
      geom_friction_rolling_range: [0.0001, 0.0001]
      randomize_geom_damping: false
      geom_damping_range: [0.0, 0.0]
      randomize_geom_stiffness: false
      geom_stiffness_range: [0.0, 0.0]
      randomize_base_mass: false
      base_mass_to_add_range: [0.0, 0.0]
      randomize_com_displacement: false
      com_displacement_range: [0.0, 0.0]
      randomize_link_mass: false
      link_mass_multiplier_range: {root_body: [1.0, 1.0], other_bodies: [1.0, 1.0]}
      randomize_joint_friction_loss: false
      joint_friction_loss_range: [0.0, 0.0]
      randomize_joint_damping: false
      joint_damping_range: [1.0, 1.0]
      randomize_joint_armature: false
      joint_armature_range: [0.01, 0.01]
    goal_params:
      visualize_goal: true
    control_type: DefaultControl
    control_params:
    reward_type: MimicHeadingReward
    reward_params:
      heading_w_sum: 0.3     # facing: exp(-5 e^2), e in rad
      heading_w_exp: 5.0
      yaw_rate_w_sum: 0.2    # turning rate: exp(-1 e^2), e in rad/s
      yaw_rate_w_exp: 1.0
      velocity_w_sum: 0.4    # pelvis forward/sideways speed: exp(-2 |e|^2), e in m/s
      velocity_w_exp: 2.0
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_foot_mimic
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 200
  total_timesteps: 300e6
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.2
  learnable_std: false
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 100
    num_envs: 100
    num: 10
    quantities:
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
    joints_to_ignore: []
